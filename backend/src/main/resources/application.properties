spring.application.name=core-api
# Render (and most hosts) tell the app which port to use through PORT
server.port=${PORT:8080}
# Trust the X-Forwarded-* headers set by the host's proxy (real client IP, https)
server.forward-headers-strategy=framework

# Database (production: DB_URL, DB_USERNAME, DB_PASSWORD come from environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vaishali_core}
spring.datasource.username=${DB_USERNAME:core_admin}
spring.datasource.password=${DB_PASSWORD:core_pass}
# Small pool: the free database plan allows only a few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (in production these come from environment variables)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiry-hours=8

# Admin login
app.admin.username=${ADMIN_USERNAME:vaishali}
app.admin.password=${ADMIN_PASSWORD:change-me-now}

# Frontend allowed to call this API (comma-separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
